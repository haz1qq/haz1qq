  <path d="M380 227q12 5 24-1" fill="none" stroke="#925e50" stroke-width="2" stroke-linecap="round"/>
  <g fill="#e0e6e7"><rect x="329" y="181" width="9" height="19" rx="4"/><rect x="443" y="181" width="9" height="19" rx="4"/></g>
  <path d="M333 199q-11 68 27 106l21 29m66-135q10 73-27 107l-39 28v47" fill="none" stroke="#ced9dd" stroke-width="2"/>
