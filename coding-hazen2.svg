  <ellipse cx="333" cy="186" rx="14" ry="22" fill="#b97d50"/>
  <ellipse cx="445" cy="186" rx="14" ry="22" fill="#b97d50"/>
  <path d="M334 146q4-52 58-52t54 53l-4 59q-5 43-49 48-44-7-53-47z" fill="#b97d50"/>
  <path d="M390 90q-25-23-49 0-26 18-18 65l14 27 5-39q34-7 48-43 15 36 47 43l7 39 13-27q10-48-18-65-25-23-49 0z" fill="#242126"/>
  <g fill="none" stroke="#493a36" stroke-width="4" stroke-linecap="round">
    <path d="M382 96q-13 25-39 34m31-38q-28 7-37 31M399 96q13 25 37 34m-30-38q28 7 37 31"/>
  </g>
  <g stroke="#46312f" stroke-width="4" fill="none" stroke-linecap="round"><path d="m352 174 18-3m35 0 18 3"/></g>
  <g fill="#29252a"><ellipse cx="363" cy="185" rx="4" ry="5"/><ellipse cx="414" cy="185" rx="4" ry="5"/></g>
  <path d="m389 184-5 18 10 2" fill="none" stroke="#ac755c" stroke-width="3" stroke-linecap="round"/>
