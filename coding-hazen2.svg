  <path d="M487 261q32-4 45 29l28 48q15 30-16 39l-75 6-8-28 57-14-34-42q-18-26 3-38z" fill="#b97d50" stroke="#925c3c" stroke-width="2"/>
  <!-- Dropped shoulders and roomy, straight sleeve hems. -->
  <path d="M323 251q-43-3-52 36l-10 36 67 6 12-42q4-26-17-36z" fill="#576d66" stroke="#273f3a" stroke-width="2"/>
  <path d="M481 251q43-2 56 36l18 36-65 8-17-43q-9-27 8-37z" fill="#576d66" stroke="#273f3a" stroke-width="2"/>
  <g fill="none" stroke="#71877e" stroke-width="1.5" stroke-linecap="round">
    <path d="m265 318 60 6m168 2 57-8"/>
  </g>
  <g fill="none" stroke="#496158" stroke-width="2" stroke-linecap="round">
    <path d="M305 269q-7 12-8 24m206-24q9 11 12 23"/>
  </g>
  <path d="m352 361 27-8q13-3 24 8l16 13-58 2" fill="#c38a5d"/>
  <path d="m475 361-22-6q-12-3-24 7l-13 13 58 2" fill="#c38a5d"/>
  <!-- Rear view: centered under his face, with screen and keyboard hidden. -->
  <ellipse cx="394" cy="387" rx="145" ry="7" fill="#352c29" opacity=".35"/>
  <path d="M262 378h264l12 6q3 4-5 5H255q-8-1-5-5z" fill="#465361" stroke="#26323e" stroke-width="2"/>
  <path d="M264 271q-1-8 8-8h244q9 0 8 8l-10 104q0 7-8 7H282q-8 0-8-7z" fill="url(#lid)" stroke="#202c38" stroke-width="3"/>
  <path d="M275 266h238" stroke="#b9c3cb" stroke-width="1.5" opacity=".7"/>
  <path d="m268 275 10 97" stroke="#a5b1bc" stroke-width="1" opacity=".4"/>
  <path d="M284 377h220" stroke="#283642" stroke-width="2"/>
  <circle cx="394" cy="320" r="23" fill="none" stroke="#d7dfe5" stroke-width="2"/>
  <text x="394" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="-.8" fill="#e2e8ec">DELL</text>
  <path d="M267 386h254" stroke="#8c99a5" stroke-width="1" opacity=".65"/>
