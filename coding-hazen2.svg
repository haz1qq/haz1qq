  <g fill="#cce4e8" opacity=".65"><ellipse cx="697" cy="344" rx="2" ry="3"/><ellipse cx="691" cy="360" rx="1.5" ry="2.5"/><ellipse cx="657" cy="353" rx="1.5" ry="2"/></g>
  <text x="420" y="455" text-anchor="middle" font-family="Verdana, sans-serif" font-size="19" font-weight="bold" fill="#e4ded4">Building whatever comes to mind.</text>
  <text x="420" y="480" text-anchor="middle" font-family="monospace" font-size="12" fill="#a8b6c6">earphones in. ideas flowing. system loading.</text>
</svg>
