  <path d="m406 229 42 13" stroke="#e9dfca" stroke-width="6"/>
  <path d="m406 229 12 4" stroke="#bc8755" stroke-width="6"/>
  <path d="m446 241 5 2" stroke="#eb8f64" stroke-width="6"/>
  <g class="smoke" fill="none" stroke="#bdc6d2" stroke-width="2" stroke-linecap="round">
    <path d="M452 233c-19-24 25-26 7-54s19-39 10-62"/>
    <path d="M458 225c25-30-10-37 7-56"/>
  </g>
  <!-- Desk and arms behind a laptop facing the seated developer. -->
  <rect x="45" y="382" width="750" height="25" rx="7" fill="url(#desk)"/>
  <path d="M77 407v38m686-38v38" stroke="#4a3b36" stroke-width="13"/>
