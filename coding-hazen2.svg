<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title desc">
  <title id="title">Hazen — building a system</title>
  <desc id="desc">A solidly built, tan-skinned man in his early twenties with understated muscle, a middle-part haircut, a thicker pencil mustache, wired earphones, and a relaxed short-sleeved shirt works on a Dell laptop centered directly in front of him, with the back of its lid facing the viewer. A cigarette rests at the corner of his mouth and a glass of iced black coffee sits beside him. A music card shows Secondhand by Don Toliver playing through his earphones. Cigarette smoke and equalizer bars animate gently.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#161e2b"/><stop offset="1" stop-color="#273344"/></linearGradient>
    <linearGradient id="lid" x2="0.8" y2="1"><stop stop-color="#87929e"/><stop offset=".45" stop-color="#596674"/><stop offset="1" stop-color="#384553"/></linearGradient>
    <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#89664e"/><stop offset="1" stop-color="#664b3c"/></linearGradient>
    <style>
      .smoke { animation: drift 4s ease-in-out infinite; }
      @keyframes drift { 0%,100% { opacity: .28; transform: translateY(3px); } 50% { opacity: .65; transform: translateY(-9px); } }
      .equalizer { transform-box: fill-box; transform-origin: center bottom; animation: beat 1.2s ease-in-out infinite alternate; }
      .equalizer:nth-child(2) { animation-delay: -.4s; }
      .equalizer:nth-child(3) { animation-delay: -.8s; }
      .equalizer:nth-child(4) { animation-delay: -.2s; }
      @keyframes beat { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) { .smoke,.equalizer { animation: none; } }
    </style>
  </defs>
  <rect width="840" height="500" rx="24" fill="url(#wall)"/>
  <!-- Window and quiet night-time workspace. -->
  <rect x="48" y="55" width="198" height="215" rx="9" fill="#0d1522" stroke="#3e4d60" stroke-width="7"/>
  <circle cx="198" cy="96" r="19" fill="#e9d6a8"/>
  <g fill="#243449"><path d="M59 260v-90h36v90m8 0V139h43v121m10 0v-70h43v70m8 0v-105h28v105"/></g>
  <g fill="#d8ad69" opacity=".65"><path d="M114 156h7v9h-7zm15 0h7v9h-7zm-15 24h7v9h-7zm58 29h7v9h-7zm44-35h7v9h-7z"/></g>
  <path d="M147 59v208M52 159h190" stroke="#3e4d60" stroke-width="5"/>
  <!-- Decorative music player, not a live playback integration. -->
  <rect x="567" y="62" width="221" height="114" rx="12" fill="#1d2938" stroke="#465369"/>
  <text x="585" y="86" font-family="monospace" font-size="10" letter-spacing="2" fill="#9dc7b3">NOW PLAYING</text>
  <text x="585" y="115" font-family="Verdana, sans-serif" font-size="20" font-weight="bold" fill="#eee5d9">Secondhand</text>
  <text x="585" y="138" font-family="monospace" font-size="11" fill="#b6c1d0">Don Toliver</text>
  <g fill="#9dc7b3">
    <rect class="equalizer" x="746" y="89" width="4" height="21" rx="2"/>
    <rect class="equalizer" x="753" y="82" width="4" height="28" rx="2"/>
    <rect class="equalizer" x="760" y="92" width="4" height="18" rx="2"/>
    <rect class="equalizer" x="767" y="86" width="4" height="24" rx="2"/>
  </g>
  <path d="M585 155h153" stroke="#435368" stroke-width="3" stroke-linecap="round"/>
  <path d="M585 155h58" stroke="#c4a7e7" stroke-width="3" stroke-linecap="round"/>
  <circle cx="643" cy="155" r="3" fill="#e1d2f2"/>
  <path d="M756 150v10m6-10v10" stroke="#b6c1d0" stroke-width="3" stroke-linecap="round"/>
  <!-- Solid frame under a relaxed shirt, without visible muscle definition. -->
  <rect x="283" y="236" width="235" height="177" rx="45" fill="#101820" stroke="#394657" stroke-width="6"/>
  <path d="M284 384l-3-72q-9-54 64-66h102q73 10 74 64l7 74z" fill="#576d66" stroke="#273f3a" stroke-width="3"/>
  <path d="M358 229v35q34 29 66-1v-36" fill="#a56943"/>
  <path d="M345 252q46 51 93 0" fill="none" stroke="#324f47" stroke-width="8"/>
  <path d="M323 320q-5 20-2 34m25-20-3 29m116-42q7 13 6 27" fill="none" stroke="#496158" stroke-width="2" stroke-linecap="round"/>
